<!DOCTYPE html>
<html id="html" lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - إدارة المصروفات</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/rtl.css">
    <link rel="stylesheet" href="css/helpers.css">
    <link rel="stylesheet" href="css/login.css">

</head>

<body>


    <!-- ======================================
         Header
    ======================================= -->

    <header class="header">

        <div class="logo">

            <img src="assets/images/logo.png" alt="Expense Manager Logo">

            <div class="logo-text">

                <h1 id="app-name" data-lang="app-name">
                    إدارة المصروفات
                </h1>

                <span>Expense Manager</span>

            </div>

        </div>

        <div class="header-actions">

            <button id="language-btn" aria-label="Change Language/تغيير اللغة" class="header-btn">
                🌐 EN
            </button>

            <button id="theme-btn" aria-label="Toggle Dark Mode/تبديل الوضع الليلي" class="header-btn">
                🌙
            </button>

        </div>

    </header>


    <!-- ======================================
         Login Form
    ======================================= -->

    <main class="login-page">

        <div class="login-card">

            <h2 data-lang="login-title">
                تسجيل الدخول
            </h2>

            <p class="login-subtitle" data-lang="login-subtitle">
                سجّل دخولك للمتابعة إلى تطبيق إدارة المصروفات
            </p>

            <form id="login-form">

                <div class="form-group">

                    <label for="email" data-lang="login-email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        data-lang-placeholder="login-email-placeholder"
                        placeholder="example@email.com"
                        required
                        autocomplete="username"
                    >

                </div>

                <div class="form-group">

                    <label for="password" data-lang="login-password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        data-lang-placeholder="login-password-placeholder"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    class="login-submit"
                    data-lang="login-button"
                >
                    دخول
                </button>

            </form>

            <p class="login-note" data-lang="login-note">
                🔒 هذا التطبيق يعمل بالكامل داخل متصفحك، وبياناتك محفوظة محليًا على جهازك فقط. هذه الشاشة تحمي وصولك المباشر فقط ولا تُعد نظام حماية حقيقي، لذا لا تستخدم كلمة مرور حساسة تستخدمها في مواقع أخرى.
            </p>

        </div>

    </main>


    <!-- ======================================
         JavaScript
    ======================================= -->

    <script src="js/storage.js"></script>
    <script src="js/language.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
